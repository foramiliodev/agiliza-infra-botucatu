<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configurações da conta · Agiliza Botucatu</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a href="#principal" class="pular">Ir para o conteúdo</a>
  <header class="topo">
    <a href="home.html" class="topo-voltar"><span aria-hidden="true">←</span> CONFIGURAÇÕES DA CONTA</a>
    <div class="perfil">
      <button type="button" class="perfil-botao" aria-expanded="false" aria-controls="perfil-menu" aria-label="Menu da conta">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
      </button>
      <div id="perfil-menu" class="perfil-menu" hidden>
        <p id="nome-usuario" class="perfil-nome"></p>
        <a href="conta.html" aria-current="page">Configurações da conta</a>
      </div>
    </div>
  </header>
  <main id="principal" tabindex="-1" class="card card-largo card-conta">
    <h1>Configurações da conta</h1>
    <div class="conta-layout">
      <!-- Barra lateral: cada funcionalidade nova da conta = um item aqui + uma <section class="conta-secao"> abaixo -->
      <nav class="conta-menu" aria-label="Seções da conta">
        <ul>
          <li><a href="#dados">Dados da conta</a></li>
          <li><a href="#sessao">Sessão</a></li>
        </ul>
      </nav>
      <div>
        <section id="dados" class="conta-secao" tabindex="-1" aria-labelledby="titulo-dados">
          <h2 id="titulo-dados">Dados da conta</h2>
          <dl id="dados-lista" class="detalhes"></dl>
        </section>
        <section id="sessao" class="conta-secao" tabindex="-1" aria-labelledby="titulo-sessao" hidden>
          <h2 id="titulo-sessao">Sessão</h2>
          <p>Sair desta conta neste navegador.</p>
          <button type="button" id="sair" class="botao botao-secundario">SAIR DA CONTA</button>
        </section>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/conta.js"></script>
</body>
</html>
