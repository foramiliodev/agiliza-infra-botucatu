<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Agiliza Botucatu</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a href="#principal" class="pular">Ir para o conteúdo</a>
  <header class="topo"><span class="topo-titulo">PORTAL DA PREFEITURA</span></header>
  <main id="principal" tabindex="-1" class="card">
    <img src="img/brasao.png" alt="Brasão de Botucatu" class="brasao" width="96" height="105">
    <h1>Entrar</h1>
    <p id="aviso" class="sucesso" role="status"></p>
    <form id="form-login" method="post">
      <label for="cpf">Digite seu CPF</label>
      <input id="cpf" name="cpf" inputmode="numeric" autocomplete="username" placeholder="000.000.000-00" maxlength="14" required>
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password" required>
      <p id="erro" class="erro" role="alert"></p>
      <button type="submit" class="botao">ENTRAR</button>
    </form>
    <p class="rodape-card">Não tem cadastro? <a href="cadastro.html">Cadastre-se</a></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
