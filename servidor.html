<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel do servidor · Agiliza Botucatu</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a href="#principal" class="pular">Ir para o conteúdo</a>
  <header class="topo">
    <span class="topo-titulo">PORTAL DA PREFEITURA</span>
    <div class="perfil">
      <button type="button" class="perfil-botao" aria-expanded="false" aria-controls="perfil-menu" aria-label="Menu da conta">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
      </button>
      <div id="perfil-menu" class="perfil-menu" hidden>
        <p id="nome-usuario" class="perfil-nome"></p>
        <a href="conta.html">Configurações da conta</a>
      </div>
    </div>
  </header>
  <main id="principal" tabindex="-1" class="card card-largo">
    <h1>Registros da secretaria</h1>
    <p id="secretaria" class="subtitulo"></p>
    <label for="filtro">Mostrar</label>
    <select id="filtro"><option value="">Todos os status</option></select>
    <p id="contagem" class="contagem" role="status"></p>
    <ul id="lista" class="lista-servidor"></ul>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/servidor.js"></script>
</body>
</html>
